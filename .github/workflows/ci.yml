name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, typecheck, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy strict check
        run: mypy app
      - name: Pytest with coverage
        run: |
          pytest --cov=app --cov-fail-under=75
          coverage report --precision=2 --include="app/aqi/*,app/rules/*,app/ai/*,app/impact/*" --fail-under=80
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend-and-e2e:
    name: Frontend lint, typecheck, unit tests, build, E2E + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime dependencies for E2E
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Vitest unit tests
        working-directory: frontend
        run: npm test
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
      - name: Check /today first-visit JS bundle size (PERF-03)
        working-directory: frontend
        run: node scripts/check-bundle.mjs
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E and axe checks
        working-directory: frontend
        run: npm run test:e2e

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
